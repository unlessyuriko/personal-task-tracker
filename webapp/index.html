<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavo - Personal Task Tracker</title>
<meta name="description" content="A calm, lavender personal task tracker. Tasks are saved in your browser.">
<meta name="theme-color" content="#F6F4FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%236B58D6'/%3E%3Cpath d='M12 4.5l1.9 5.4 5.6 2.1-5.6 2.1L12 19.5l-1.9-5.4L4.5 12l5.6-2.1z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z" fill="currentColor"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l2.5-7.5A2 2 0 017.4 4h9.2a2 2 0 011.9 1.5L21 13v5a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="currentColor" opacity=".25"/><path d="M3 13h5l1 2.5h6l1-2.5h5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="currentColor" opacity=".25"/><rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-disk" viewBox="0 0 24 24"><path d="M5 3.5h11l3.5 3.5v11a2 2 0 01-2 2H5a2 2 0 01-2-2v-12.5a2 2 0 012-2z" fill="currentColor" opacity=".25"/><path d="M5 3.5h11l3.5 3.5v11a2 2 0 01-2 2H5a2 2 0 01-2-2v-12.5a2 2 0 012-2zM7.5 3.5v5h7v-5M7.5 20.5v-6h9v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/></symbol>
<symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4.5 9h16M3.5 15h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 102.6-5.9M4 4v4.5h4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5v14l9-7zM17 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.5 3.5 5.5 6 5.5 11.2a5.5 5.5 0 01-11 0c0-2 1-3.4 2-4.4.2 1.4.9 2.2 1.7 2.5C10 8.5 10.5 5 12 2.5z" fill="currentColor"/></symbol>
<symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></g></symbol>
<symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14l-1 12.5a2 2 0 01-2 1.5H8a2 2 0 01-2-1.5z" fill="currentColor" opacity=".25"/><path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 12.5a2 2 0 002 1.5h6a2 2 0 002-1.5L18 7M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z" fill="currentColor" opacity=".25"/><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></symbol>
</defs></svg>

<div class="app">
  <nav class="card side" aria-label="Main">
    <div class="brand"><div class="logo"><svg class="i"><use href="#i-logo"/></svg></div>Lavo</div>
    <button class="nav" id="nav-quick" type="button"><svg class="i"><use href="#i-plus"/></svg> Quick add <span class="kbd">Q</span></button>
    <button class="nav" data-view="inbox" type="button"><svg class="i"><use href="#i-inbox"/></svg> Inbox <span class="n" data-count="inbox"></span></button>
    <button class="nav" data-view="today" type="button"><svg class="i"><use href="#i-sun"/></svg> Today <span class="n" data-count="today"></span></button>
    <button class="nav" data-view="upcoming" type="button"><svg class="i"><use href="#i-cal"/></svg> Upcoming <span class="n" data-count="upcoming"></span></button>
    <button class="nav" data-view="completed" type="button"><svg class="i"><use href="#i-check"/></svg> Completed</button>
    <div class="sec"><span>Projects</span><button class="icon-btn sm" id="add-project" type="button" aria-label="Add project" title="Add project"><svg class="i"><use href="#i-plus"/></svg></button></div>
    <div id="projects" class="projects"></div>
    <button class="me" id="open-settings" type="button" aria-label="Open settings">
      <span class="av" id="avatar">?</span>
      <span class="me-text"><b id="me-name">Your name</b><span class="me-sub"><svg class="i"><use href="#i-disk"/></svg> Saved in this browser</span></span>
    </button>
  </nav>

  <main>
    <div class="head">
      <div><p id="eyebrow" class="eyebrow"></p><h1 id="title"></h1></div>
      <div class="head-right">
        <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search" aria-label="Search tasks" autocomplete="off"><span class="kbd">/</span></label>
      </div>
    </div>

    <form class="card add" id="composer" autocomplete="off">
      <span class="add-plus"><svg class="i"><use href="#i-plus"/></svg></span>
      <input id="task-input" placeholder="Add a task...  try &quot;Review report tomorrow !high #Work&quot;" aria-label="New task">
      <button class="chip" type="button" id="chip-date"><svg class="i"><use href="#i-cal"/></svg><span>Date</span></button>
      <button class="chip" type="button" id="chip-pri"><svg class="i"><use href="#i-flag"/></svg><span>Priority</span></button>
      <button class="chip" type="button" id="chip-proj"><svg class="i"><use href="#i-hash"/></svg><span>Project</span></button>
      <input type="date" id="date-pick" class="hidden-date" tabindex="-1" aria-hidden="true">
      <button class="btn" type="submit">Add</button>
    </form>

    <div class="tabs" id="sort-tabs" role="tablist" aria-label="Sort tasks">
      <button class="tab" data-sort="grouped" role="tab" type="button">Grouped</button>
      <button class="tab" data-sort="priority" role="tab" type="button">By priority</button>
      <button class="tab" data-sort="date" role="tab" type="button">By date</button>
      <button class="tab" data-sort="manual" role="tab" type="button">Manual</button>
      <span class="tabs-spacer"></span>
      <button class="link-btn" id="clear-completed" type="button" hidden>Clear completed</button>
      <button class="link-btn danger" id="delete-project" type="button" hidden>Delete project</button>
    </div>

    <section class="card group" aria-label="Tasks">
      <div class="thead"><span></span><span></span><span>Task</span><span>Project</span><span>Due</span><span class="c-pri">Priority</span><span></span></div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <aside>
    <section class="card focus" aria-label="Main focus">
      <div class="lbl">Main focus</div>
      <h3 id="focus-title">Nothing to focus on</h3>
      <div class="timer" id="timer" role="timer" aria-live="off">25:00</div>
      <div class="row">
        <button class="fb w" id="timer-toggle" type="button"></button>
        <button class="fb g icon" id="timer-reset" type="button" aria-label="Reset timer" title="Reset timer"><svg class="i"><use href="#i-reset"/></svg></button>
        <button class="fb g icon" id="focus-skip" type="button" aria-label="Next focus task" title="Next task"><svg class="i"><use href="#i-skip"/></svg></button>
      </div>
    </section>
    <section class="card stat" aria-label="Today's progress">
      <div class="ring" id="ring"><i id="ring-pct">0%</i></div>
      <div><b>Today's progress</b><div class="muted" id="stat-text"></div><div class="muted streak" id="streak"></div></div>
    </section>
    <section class="card week" aria-label="This week">
      <h4>This week</h4>
      <div class="bars" id="bars"></div>
      <div class="bars-labels" id="bar-labels"></div>
    </section>
  </aside>
</div>

<dialog id="detail" aria-label="Task details"></dialog>
<dialog id="settings" aria-label="Settings"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
